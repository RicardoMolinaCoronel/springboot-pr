server:
  port: 8081

spring:
  application:
    name: forest-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


management:
  tracing:
    sampling:
      probability: 1.0    # 100% in dev; reduce in prod (e.g., 0.1)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans



